# ==============================================================================
# Trivy Configuration File
# ==============================================================================
# This configuration file is used to scan Terraform code for security issues,
# misconfigurations, and vulnerabilities.
# ==============================================================================

# Scan settings
scan:
  scanners:
    - vuln
    - misconfig
    
  severity:
    - CRITICAL
    - HIGH
    - MEDIUM
    - LOW

# Package settings
pkg:
  types:
    - os
    - library

# Misconfiguration settings
misconfiguration:
  include-non-failures: false

  terraform:
    exclude-downloaded-modules: false
    
    vars:
      - "./environments/development.tfvars"

# Output settings
format: table

# Timeout settings
timeout: 5m

# Ignore unfixed vulnerabilities
ignore-unfixed: false

# Exit code when vulnerabilities are found
exit-code: 1

# Ignore file path
ignorefile: "./.trivyignore.yaml"

# Paths to exclude from scanning
skip-dirs:
  - .terraform

# Files to exclude from scanning
skip-files:
  - "**/*.tfstate"
  - "**/*.tfstate.backup"
  - "**/*.lock.hcl"

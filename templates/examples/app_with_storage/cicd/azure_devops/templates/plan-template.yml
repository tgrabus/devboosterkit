# ==============================================================================
# Azure DevOps Build Template
# ==============================================================================
# This YAML pipeline will:
#   1. Plan Terraform changes
#   2. Scan terraform against misconfiguration and vulnerabilities
# ==============================================================================

parameters:
  - name: AzureRmServiceConnection
    type: string

  - name: Environment
    type: string

  - name: RootModulePath
    type: string

jobs:
  # ----------------------------------------------------------------------------
  # Plan terraform
  # ----------------------------------------------------------------------------      
  - job: Plan
    displayName: "🏗️ Plan for ${{ parameters.Environment }}"
    timeoutInMinutes: 60
    variables:
      PlanOutputFile: '${{ parameters.Environment }}.tfplan'
      PlanOutputFileJson: '${{ parameters.Environment }}.tfplan.json'
    steps:
      - checkout: self
        displayName: "Checkout Repository"

      - task: TerraformInstaller@1
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: $(terraformVersion)

      - task: TerraformTask@5
        displayName: 'Init Terraform'
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: ${{ parameters.RootModulePath }}
          backendServiceArm: ${{ parameters.AzureRmServiceConnection }}
          backendAzureRmUseEntraIdForAuthentication: true
          backendAzureRmResourceGroupName: $(BACKEND_AZURE_RESOURCE_GROUP_NAME)
          backendAzureRmStorageAccountName: $(BACKEND_AZURE_STORAGE_ACCOUNT_NAME)
          backendAzureRmContainerName: $(BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME)
          backendAzureRmKey: $(BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_KEY_NAME)

      - task: TerraformTask@5
        name: terraformPlan
        displayName: 'Terraform Plan'
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: ${{ parameters.RootModulePath }}
          commandOptions: >-
            -input=false 
            -out=$(PlanOutputFile) 
            -detailed-exitcode
            -var-file=environments/${{ parameters.Environment }}.tfvars
          environmentServiceNameAzureRM: ${{ parameters.AzureRmServiceConnection }}
          
      - script: |
          terraform show -json ${{ parameters.RootModulePath }}/$(PlanOutputFile) > ${{ parameters.RootModulePath }}/$(PlanOutputFileJson)
        displayName: 'Convert Plan to JSON'
        name: planOutputs
        
      - task: trivy@2
        displayName: "👮 Validate security for ${{ parameters.Environment }}"
        inputs:
          method: install
          version: 'latest'
          type: 'filesystem'
          target: '${{ parameters.RootModulePath }}/$(PlanOutputFileJson)'
          options: >-
            --config $(Build.SourcesDirectory)/trivy.yaml
            --ignorefile $(Build.SourcesDirectory)/.trivyignore.yaml
          scanners: 'misconfig'
